---
services:
  nginx:
    image: nginx:alpine
    ports: [80:80, 443:443]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [frontend, backend]
    restart: always
  frontend:
    build: ./frontend
    env_file: [./frontend/.env]
    environment:
      - PUBLIC_BACKEND_URL=https://api.dihcord.com
      - BACKEND_URL=http://backend:8080
  backend:
    build: ./backend
    env_file: [./backend/.env]
    environment: [DOMAIN=dihcord.com]
    volumes: [./backend/.env:/.env, ./backend/chat.db:/chat.db]
