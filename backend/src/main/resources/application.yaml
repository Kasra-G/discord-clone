---
kind: Application
ktor:
  development: true
  deployment:
    watch:
      - classes
      - resources
    port: 8080
  application:
    modules:
      - com.ghkasra.discordclone.CallLoggingKt.configureCallLogging
      - com.ghkasra.discordclone.SecurityKt.configureSecurity
      - com.ghkasra.discordclone.HttpKt.configureHttp
      - com.ghkasra.discordclone.SerializationKt.configureSerialization
      - com.ghkasra.discordclone.WebsocketsKt.configureWebsockets
      - com.ghkasra.discordclone.RoutingKt.configureRouting
      - com.ghkasra.discordclone.RequestValidationKt.configureRequestValidation
